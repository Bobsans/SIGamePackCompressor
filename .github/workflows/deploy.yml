name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips-tools libheif-plugin-aomenc libheif-plugin-aomdec
      - name: Test backend
        working-directory: api
        env:
          SI_MEDIA_TESTS: '1'
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        env:
          API_SERVER_URL: ${{ vars.API_SERVER_URL }}
        run: |
          npm ci
          npm run build
      - name: Build release
        run: |
          mkdir -p build/web
          cd api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${{ github.sha }}" -o ../build/sigame-compressor ./cmd/server
          cd ..
          cp -r app/dist/. build/web/
          cp config.example.yaml build/
          cp THIRD_PARTY_NOTICES.md build/
      - uses: actions/upload-artifact@v4
        with:
          name: sigame-compressor-linux-amd64
          path: build/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sigame-compressor-linux-amd64
          path: build
      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: build/*
          target: /tmp/sigpc-${{ github.run_id }}
          strip_components: 1
      - name: Activate Go release
        uses: appleboy/ssh-action@v1
        env:
          GO_OUTPUT_PATH: ${{ vars.SSH_PATH }}
          GO_SERVICE_NAME: ${{ vars.GO_SERVICE_NAME }}
          GO_RUN_ID: ${{ github.run_id }}
          GO_EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GO_OUTPUT_PATH,GO_SERVICE_NAME,GO_RUN_ID,GO_EXPECTED_SHA
          script: |
            set -eu
            case "$GO_OUTPUT_PATH" in /*) ;; *) exit 1;; esac
            test "$GO_OUTPUT_PATH" != /
            test "$(readlink -f "$GO_OUTPUT_PATH")" = "$GO_OUTPUT_PATH"
            test -n "$GO_SERVICE_NAME"
            case "$GO_RUN_ID" in ''|*[!0-9]*) exit 1;; esac
            command -v vips
            command -v vipsheader
            command -v ffmpeg
            command -v ffprobe
            test -f "$GO_OUTPUT_PATH/config.yaml"
            test -d "$GO_OUTPUT_PATH/storage"
            STAGE="/tmp/sigpc-$GO_RUN_ID"
            test -f "$STAGE/sigame-compressor"
            chmod +x "$STAGE/sigame-compressor"
            test "$("$STAGE/sigame-compressor" --version)" = "$GO_EXPECTED_SHA"
            rm -rf -- "$GO_OUTPUT_PATH/web.next"
            mkdir -p "$GO_OUTPUT_PATH/web.next"
            cp -r "$STAGE/web/." "$GO_OUTPUT_PATH/web.next/"
            cp "$STAGE/sigame-compressor" "$GO_OUTPUT_PATH/sigame-compressor.next"
            mv "$GO_OUTPUT_PATH/sigame-compressor.next" "$GO_OUTPUT_PATH/sigame-compressor"
            rm -rf -- "$GO_OUTPUT_PATH/web"
            mv "$GO_OUTPUT_PATH/web.next" "$GO_OUTPUT_PATH/web"
            sudo systemctl restart "$GO_SERVICE_NAME"
            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://127.0.0.1:8066/health | grep -Fq "$GO_EXPECTED_SHA"; then healthy=true; break; fi
              sleep 1
            done
            test "$healthy" = true
            rm -rf -- "$STAGE"
